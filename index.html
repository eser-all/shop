<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  const BACKEND_GATEWAY_URL = 'http://localhost:5000/api/mikrotik/toggle-user';

  // Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAfq988qijqN69xjUiZPRdiXlfN3-Dtngs",
    authDomain: "isp-billing-92ce2.firebaseapp.com",
    databaseURL: "https://isp-billing-92ce2-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "isp-billing-92ce2",
    storageBucket: "isp-billing-92ce2.firebasestorage.app",
    messagingSenderId: "951649795315",
    appId: "1:951649795315:web:f9a80ca1520d41b22c0b86",
    measurementId: "G-FCSWY5X5B8"
  };

  firebase.initializeApp(firebaseConfig);
  const _auth = firebase.auth();
  const _db = firebase.database();

  let _user = null;
  let _cache = [];

  const toggleLoader = (val, text = "ডাটা প্রসেস হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...") => {
    document.getElementById('loaderText').innerText = text;
    document.getElementById('loader').style.display = val ? 'flex' : 'none';
  };

  function getCurrentMonthKey() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  // Updated Authentication State Listener with Error Handling
  _auth.onAuthStateChanged(async (u) => {
    toggleLoader(true);
    try {
      if (u) {
        _user = u;
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        document.getElementById('userDisplayEmail').innerText = _user.email;
        document.getElementById('currentMonthLabel').innerText = `মাসিক বিলিং সেশন: ${getCurrentMonthKey()}`;
        await checkAndRunMonthlyRenewal();
        loadClients();
      } else {
        _user = null;
        document.getElementById('authSection').style.display = 'block';
        document.getElementById('dashboardSection').style.display = 'none';
      }
    } catch (err) {
      console.error("Auth Exception:", err);
      alert("ডাটাবেজ কানেকশনে সমস্যা হয়েছে: " + err.message);
    } finally {
      toggleLoader(false);
    }
  });

  document.getElementById('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    toggleLoader(true);
    const errorEl = document.getElementById('authError');
    errorEl.style.display = 'none';

    try {
      await _auth.signInWithEmailAndPassword(
        document.getElementById('authEmail').value,
        document.getElementById('authPassword').value
      );
    } catch (e) {
      errorEl.style.display = 'block';
      errorEl.innerText = "লগইন তথ্য ভুল হয়েছে!";
    } finally {
      toggleLoader(false);
    }
  });

  function logout() { _auth.signOut(); }

  // Excel/CSV File Read and Batch Upload Function
  function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    document.getElementById('fileNameDisplay').innerText = file.name;
    toggleLoader(true, "ফাইল থেকে ডাটা রিড করা হচ্ছে...");

    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const sheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[sheetName];
        const jsonData = XLSX.utils.sheet_to_json(sheet);

        if (jsonData.length === 0) {
          alert("ফাইলের মধ্যে কোনো ডাটা পাওয়া যায়নি!");
          toggleLoader(false);
          return;
        }

        toggleLoader(true, `মোট ${jsonData.length} টি ক্লায়েন্টের তথ্য ডাটাবেজে সেভ হচ্ছে...`);

        const updates = {};
        const currentMonth = getCurrentMonthKey();

        jsonData.forEach(row => {
          const username = (row['Username'] || row['Customer ID'] || row['id'] || '').toString().trim();
          if (!username) return;

          const name = row['Name'] || 'N/A';
          const mobile = (row['Mobile'] || row['Phone'] || '').toString().trim();
          const pkg = row['Package'] || 'Basic';
          const billAmount = Number(parseFloat(row['Bill Amount'] || 0).toFixed(2)) || 0;
          const statusRaw = row['Status'] || 'Enabled';
          const status = (statusRaw.toLowerCase() === 'enabled') ? 'Paid' : 'Unpaid';

          updates[`users/${_user.uid}/isp_clients/${username}`] = {
            id: username,
            name: name,
            phone: mobile,
            package: pkg,
            billAmount: billAmount,
            status: status,
            address: row['Address'] || '',
            pop: row['POP'] || '',
            lastUpdatedMonth: currentMonth,
            updatedAt: Date.now()
          };
        });

        await _db.ref().update(updates);
        alert(`সফলভাবে ${Object.keys(updates).length} জন ক্লায়েন্টের ডাটা ইমপোর্ট হয়েছে!`);

      } catch (err) {
        alert("ফাইল প্রসেসিং এ সমস্যা হয়েছে: " + err.message);
      } finally {
        toggleLoader(false);
        document.getElementById('excelFileInput').value = '';
      }
    };

    reader.readAsArrayBuffer(file);
  }

  // Single Client Form Submit
  document.getElementById('clientForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!_user) return;

    toggleLoader(true);
    const clientData = {
      id: document.getElementById('clientId').value.trim(),
      name: document.getElementById('clientName').value.trim(),
      phone: document.getElementById('clientPhone').value.trim(),
      package: document.getElementById('clientPackage').value.trim(),
      billAmount: Number(parseFloat(document.getElementById('billAmount').value).toFixed(2)) || 0,
      status: document.getElementById('paymentStatus').value,
      lastUpdatedMonth: getCurrentMonthKey(),
      updatedAt: Date.now()
    };

    try {
      await _db.ref(`users/${_user.uid}/isp_clients/${clientData.id}`).set(clientData);
      document.getElementById('clientForm').reset();
    } catch (err) {
      alert("ত্রুটি: " + err.message);
    } finally {
      toggleLoader(false);
    }
  });

  function loadClients() {
    if (_user) {
      _db.ref(`users/${_user.uid}/isp_clients`).on('value', (snap) => {
        const val = snap.val();
        _cache = val ? Object.values(val) : [];
        filterData();
      });
    }
  }

  function renderTable(records) {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    let totalPaid = 0, totalUnpaid = 0, expectedBill = 0;

    records.forEach((item) => {
      expectedBill += item.billAmount;
      if (item.status === 'Paid') totalPaid += item.billAmount;
      else totalUnpaid += item.billAmount;

      const statusBadge = item.status === 'Paid' 
        ? '<span class="badge bg-success">Paid (Enabled)</span>' 
        : '<span class="badge bg-danger">Unpaid (Disabled)</span>';

      const row = `
        <tr>
          <td>
            <div class="fw-bold text-dark">${item.id}</div>
            <small class="text-muted">${item.pop || ''}</small>
          </td>
          <td>
            <div class="fw-semibold">${item.name}</div>
            <small class="text-muted">${item.phone || 'N/A'}</small>
          </td>
          <td><span class="badge bg-info text-dark">${item.package}</span></td>
          <td class="fw-bold">৳ ${item.billAmount.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
          <td>${statusBadge}</td>
          <td class="text-center">
            <button onclick="toggleStatus('${item.id}', '${item.status}')" class="btn btn-sm btn-outline-primary me-1" title="স্ট্যাটাস পরিবর্তন করুন">
              <i class="fa-solid fa-arrows-rotate"></i>
            </button>
            <button onclick="deleteClient('${item.id}')" class="btn btn-sm btn-outline-danger" title="ডিলিট করুন">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
      `;
      tbody.innerHTML += row;
    });

    document.getElementById('statTotalClients').innerText = records.length;
    document.getElementById('statTotalPaid').innerText = `৳ ${totalPaid.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
    document.getElementById('statTotalUnpaid').innerText = `৳ ${totalUnpaid.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
    document.getElementById('statExpectedBill').innerText = `৳ ${expectedBill.toLocaleString('en-US', {minimumFractionDigits: 2})}`;
  }

  async function toggleStatus(id, currentStatus) {
    if (!_user) return;
    const newStatus = currentStatus === 'Paid' ? 'Unpaid' : 'Paid';
    toggleLoader(true);
    try {
      await _db.ref(`users/${_user.uid}/isp_clients/${id}/status`).set(newStatus);
    } catch (e) {
      alert("ত্রুটি: " + e.message);
    } finally {
      toggleLoader(false);
    }
  }

  async function deleteClient(id) {
    if (confirm("আপনি কি নিশ্চিত যে এই ক্লায়েন্টের তথ্য ডিলিট করতে চান?")) {
      toggleLoader(true);
      try {
        await _db.ref(`users/${_user.uid}/isp_clients/${id}`).remove();
      } catch (e) {
        alert("ত্রুটি: " + e.message);
      } finally {
        toggleLoader(false);
      }
    }
  }

  async function checkAndRunMonthlyRenewal() {
    if (!_user) return;
    const currentMonth = getCurrentMonthKey();
    const metaRef = _db.ref(`users/${_user.uid}/billing_meta/lastRenewedMonth`);
    const snap = await metaRef.once('value');
    if (snap.val() !== currentMonth) {
      await processMonthlyBatchRenewal(currentMonth);
    }
  }

  async function processMonthlyBatchRenewal(currentMonth) {
    const snap = await _db.ref(`users/${_user.uid}/isp_clients`).once('value');
    const clients = snap.val();
    if (clients) {
      const updates = {};
      for (const id of Object.keys(clients)) {
        updates[`users/${_user.uid}/isp_clients/${id}/status`] = 'Unpaid';
        updates[`users/${_user.uid}/isp_clients/${id}/lastUpdatedMonth`] = currentMonth;
      }
      updates[`users/${_user.uid}/billing_meta/lastRenewedMonth`] = currentMonth;
      await _db.ref().update(updates);
    }
  }

  async function manualMonthlyRenewal() {
    if (confirm("নতুন মাসের জন্য সমস্ত ক্লায়েন্টের বিল Unpaid করতে চান?")) {
      toggleLoader(true);
      try {
        await processMonthlyBatchRenewal(getCurrentMonthKey());
        alert("সফলভাবে রিনেউ সম্পন্ন হয়েছে!");
      } catch (e) { alert("ত্রুটি: " + e.message); } 
      finally { toggleLoader(false); }
    }
  }

  function filterData() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const filtered = _cache.filter(item => 
      item.name.toLowerCase().includes(q) ||
      item.id.toLowerCase().includes(q) ||
      (item.phone && item.phone.includes(q)) ||
      (item.package && item.package.toLowerCase().includes(q))
    );
    renderTable(filtered);
  }

  function exportExcel() {
    if (_cache.length === 0) return alert("ডাটা নেই!");
    const dataToExport = _cache.map(item => ({
      "Customer ID": item.id,
      "Username": item.id,
      "Name": item.name,
      "Mobile": item.phone,
      "Package": item.package,
      "Bill Amount": item.billAmount,
      "Status": item.status === 'Paid' ? 'Enabled' : 'Disabled',
      "Address": item.address || '',
      "POP": item.pop || ''
    }));
    const worksheet = XLSX.utils.json_to_sheet(dataToExport);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "ISPClients");
    XLSX.writeFile(workbook, `radcheck_export_${getCurrentMonthKey()}.xlsx`);
  }
</script>
